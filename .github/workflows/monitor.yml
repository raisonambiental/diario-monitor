name: Monitor Diário Oficial

on:
  schedule:
    # 12:00 UTC = 09:00 em MS (horário padrão, sem horário de verão no Brasil atualmente)
    # Diários costumam sair de manhã; ajuste o horário abaixo se quiser.
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}  # permite rodar manualmente pela aba "Actions" no GitHub

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salvar estado (evita alertas duplicados)
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Atualiza estado do monitor"
          git push
